name: APEX ARX Automatic Capture Validation

on:
  push:
    branches:
      - arx-autonomous-capture
    paths:
      - 'APEX/runtime-captures/**'
      - 'APEX/automation/github-auto-capture/**'
      - 'APEX/os/canon/**'
      - 'APEX/governance/project-rules/**'
      - '.github/workflows/apex-arx-auto-capture-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout captured artifacts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate APEX ARX runtime-captured artifacts
        run: python APEX/automation/github-auto-capture/v0.2.0-DRAFT/scripts/validate_capture_v2.py

      - name: Validate APEX governed canon and global rules
        run: python APEX/automation/github-auto-capture/v0.2.0-DRAFT/scripts/validate_governed_canon_v2.py
